<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moneyball - Football Data Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-purple: #a371f7;
            --accent-yellow: #d29922;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .hero-section {
            background: linear-gradient(135deg, rgba(13, 17, 23, .95), rgba(22, 27, 34, .9)), url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=2000');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 50%, rgba(88, 166, 255, .1) 0%, transparent 50%), radial-gradient(circle at 70% 50%, rgba(163, 113, 247, .1) 0%, transparent 50%);
        }

        .hero-content {
            text-align: center;
            z-index: 1;
            padding: 40px;
            max-width: 800px;
        }

        .hero-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .hero-logo i {
            font-size: 56px;
            color: var(--accent-yellow);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .hero-title {
            font-size: 64px;
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 22px;
            color: var(--text-secondary);
            margin-bottom: 48px;
            line-height: 1.6;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-hero-primary {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            transition: all .3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-hero-primary:hover {
            background: #79c0ff;
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(88, 166, 255, .3);
            color: white;
        }

        .btn-hero-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 2px solid var(--text-secondary);
            padding: 14px 38px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            transition: all .3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-hero-secondary:hover {
            border-color: var(--accent-purple);
            color: var(--accent-purple);
            transform: translateY(-3px);
        }

        .stats-preview {
            display: flex;
            justify-content: center;
            gap: 48px;
            margin-top: 64px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 36px;
            font-weight: 800;
            color: var(--accent-blue);
        }

        .stat-text {
            font-size: 14px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 40px;
            }

            .hero-subtitle {
                font-size: 18px;
            }

            .hero-buttons {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>
    <section class="hero-section">
        <div class="hero-content">
            <div class="hero-logo"><i class="bi bi-trophy-fill"></i></div>
            <h1 class="hero-title">MONEYBALL</h1>
            <p class="hero-subtitle">The world's most comprehensive football data analysis and management
                platform.<br>Player valuations, match analysis, and performance tracking.</p>
            <div class="hero-buttons">
                <a href="{{ url_for('auth.login') }}" class="btn-hero-primary"><i
                        class="bi bi-box-arrow-in-right"></i>Login</a>
                <a href="{{ url_for('auth.register') }}" class="btn-hero-secondary"><i
                        class="bi bi-person-plus"></i>Sign Up</a>
            </div>
            <div class="stats-preview">
                <div class="stat-item">
                    <div class="stat-number">28K+</div>
                    <div class="stat-text">Players</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">500+</div>
                    <div class="stat-text">Clubs</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">70K+</div>
                    <div class="stat-text">Matches</div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
