{% extends "base.html" %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; height: 80vh;">
    
    <div class="card" style="width: 100%; max-width: 400px; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: white; text-align: center;">
        
        <h2 style="color: #2c3e50; margin-bottom: 30px; font-weight: 700;">Kayıt Ol</h2>
        
        <form method="POST" action="{{ url_for('register') }}">
            
            <div style="margin-bottom: 20px; text-align: left;">
                <label style="color: #7f8c8d; font-weight: 600; font-size: 0.9rem;">Kullanıcı Adı Belirle</label>
                <input type="text" name="username" required 
                       style="width: 100%; padding: 12px; border: 2px solid #ecf0f1; border-radius: 8px; margin-top: 5px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 30px; text-align: left;">
                <label style="color: #7f8c8d; font-weight: 600; font-size: 0.9rem;">Şifre Belirle</label>
                <input type="password" name="password" required 
                       style="width: 100%; padding: 12px; border: 2px solid #ecf0f1; border-radius: 8px; margin-top: 5px; box-sizing: border-box;">
            </div>

            <button type="submit" 
                    style="width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.3s;">
                KAYIT OL
            </button>
        </form>

        <p style="margin-top: 20px; color: #7f8c8d;">
            Zaten hesabın var mı? <a href="{{ url_for('login') }}" style="color: #3498db; font-weight: bold; text-decoration: none;">Giriş Yap</a>
        </p>

    </div>
</div>
{% endblock %}
